<style>

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 8px}

.tabs button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}

<body>
<main>
<div class="top">
  <h1>G12.1 · Фрезеровка</h1>
  <div><div class="xlab">X в программе</div><div class="xsel" id="xsel"><button data-x="diameter" aria-pressed="true">диаметр</button><button data-x="radius" aria-pressed="false">радиус</button></div></div>
</div>
<div class="tabs" id="tabs"></div>

<div class="row"><button class="btn" id="calc">Рассчитать</button><button class="btn sec" id="reset">Сбросить</button></div>
<div id="errs" class="err"></div>

<div id="out" class="hide">
  <div class="card" id="viewCard" style="margin-top:12px"><h2 id="viewTitle">Схема</h2>
    <svg id="svg" viewBox="-60 -60 120 120" role="img" aria-label="Схема"></svg>
    <div class="legend" id="legend"></div>
  </div>
  <div class="card"><h2>Итог</h2><div class="sum" id="sum"></div></div>
  <div class="card" id="codeCard"><h2 id="codeTitle">G-код</h2>
    <pre id="code"></pre>
    <div class="row"><button class="btn" id="copy">Копировать</button><button class="btn sec" id="share">Поделиться</button></div>
  </div>
</div>
</main>
<script>/* Контур для полярной интерполяции Fanuc (G12.1): лыски и многогранник со скруглением углов.
 * Плоскость полярки: x — радиальная координата (в программе X = 2*x, диаметр), c — виртуальная ось, мм.
 * Выдаётся только контур: подход, обход, отход.
 */
(function (root) {
  'use strict';
  var D2R = Math.PI / 180;

  function fmt(v) {
    var s = (Math.round(v * 1000) / 1000).toFixed(3).replace(/0+$/, '');
    if (s.slice(-1) === '.') s += '0';
    if (s === '-0.0') s = '0.0';
    return s;
  }
  function P(x, c) { return { x: x, c: c }; }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.c - b.c); }
  function frame(phiDeg) {
    var ph = phiDeg * D2R, n = { x: Math.cos(ph), c: Math.sin(ph) };
    return { n: n, at: function (a, b) { return P(a * n.x - b * n.c, a * n.c + b * n.x); } };
  }
  // центр дуги по хорде и радиусу (дуга < 180°); ccw=true для G03
  function arcCentre(a, b, R, ccw) {
    var mx = (a.x + b.x) / 2, mc = (a.c + b.c) / 2, dx = b.x - a.x, dc = b.c - a.c, l = Math.hypot(dx, dc);
    var h = Math.sqrt(Math.max(0, R * R - l * l / 4)), lx = -dc / l, lc = dx / l, s = ccw ? 1 : -1;
    return P(mx + s * h * lx, mc + s * h * lc);
  }
  function tess(a, b, R, ccw) {
    var c = arcCentre(a, b, R, ccw), a0 = Math.atan2(a.c - c.c, a.x - c.x), a1 = Math.atan2(b.c - c.c, b.x - c.x);
    var d = a1 - a0; if (ccw) { while (d < 0) d += 2 * Math.PI; } else { while (d > 0) d -= 2 * Math.PI; }
    var n = Math.max(4, Math.ceil(Math.abs(d) / (3 * D2R))), out = [];
    for (var i = 1; i <= n; i++) { var t = a0 + d * i / n; out.push(P(c.x + R * Math.cos(t), c.c + R * Math.sin(t))); }
    return out;
  }

  function common(p) {
    var e = [];
    if (!(p.D > 0)) e.push('Диаметр заготовки должен быть больше 0');
    if (!(p.toolD > 0)) e.push('Диаметр фрезы должен быть больше 0');
    if (!(p.gap > 0)) e.push('Зазор до заготовки должен быть больше 0');
    return e;
  }

  // контур -> segs для вывода; centre — ломаная центра фрезы для превью
  function finish(c) {
    var pts = [c.start];
    c.segs.forEach(function (s, i) {
      var from = i === 0 ? c.start : c.segs[i - 1].pt;
      if (s.arc) { tess(from, s.pt, s.arc.R, s.arc.ccw).forEach(function (q) { pts.push(q); }); } else pts.push(s.pt);
    });
    c.line = pts; // полилиния запрограммированного контура
    return c;
  }

  /* ---------- ЛЫСКИ ---------- */
  function buildFlats(p) {
    var err = common(p), R = p.D / 2, r = p.toolD / 2, aT;
    if (p.count === 2) aT = p.size / 2;
    else if (p.flatMode === 'h') aT = p.size;
    else if (p.flatMode === 't') aT = R - p.size;
    else aT = p.size - R;
    if (!(aT >= 0)) err.push('Размер лыски даёт расстояние от оси < 0');
    if (aT >= R) err.push('Лыска не снимает материал (расстояние от оси ≥ радиуса заготовки)');
    if (err.length) return { errors: err };
    var comp = p.comp || null, rf = p.corner > 0 ? p.corner : 0;
    var rfMax = (R + aT) / 2;
    if (rf > rfMax + 1e-9) return { errors: ['Радиус скругления краёв лыски не может быть больше ' + fmt(rfMax) + ' мм (для этого диаметра и размера)'] };
    var tc = Math.sqrt((R + r + p.gap) * (R + r + p.gap) - (aT + r) * (aT + r));
    var sign = comp === 'G41' ? -1 : comp === 'G42' ? 1 : (p.dir === 'CW' ? -1 : 1);
    var b0 = -sign * tc, b1 = sign * tc;
    var phis = p.count === 2 ? [p.phi, p.phi + 180] : [p.phi];
    var Rpre = R + r + p.gap;
    // offs = 0 — контур детали (для коррекции), offs = r — траектория центра фрезы
    function flatGen(fr, offs) {
      if (rf <= 0) {
        var s0 = fr.at(aT + offs, b0), s1 = fr.at(aT + offs, b1);
        return { pre: fr.at(aT + r + p.gap, b0), start: s0, segs: [{ pt: s1 }], post: fr.at(aT + r + p.gap, b1) };
      }
      var w = Math.sqrt((R - aT) * (R + aT - 2 * rf)), ccw = sign === 1;
      var c1 = fr.at(aT - rf, -sign * w), c2 = fr.at(aT - rf, sign * w);
      var l1 = Math.hypot(c1.x, c1.c), u1 = P(c1.x / l1, c1.c / l1), u2 = P(c2.x / l1, c2.c / l1);
      var ro = rf + offs;
      var start = P(c1.x + ro * u1.x, c1.c + ro * u1.c), e1 = fr.at(aT + offs, -sign * w);
      var e2 = fr.at(aT + offs, sign * w), end = P(c2.x + ro * u2.x, c2.c + ro * u2.c);
      return { pre: P(u1.x * Rpre, u1.c * Rpre), start: start,
        segs: [{ pt: e1, arc: { R: ro, ccw: ccw } }, { pt: e2 }, { pt: end, arc: { R: ro, ccw: ccw } }],
        post: P(u2.x * Rpre, u2.c * Rpre) };
    }
    var contours = phis.map(function (phi, i) {
      var fr = frame(phi), c = flatGen(fr, comp ? 0 : r);
      c.centre = finish(flatGen(fr, r)).line;
      c.label = 'ЛЫСКА ' + (i + 1) + ' (нормаль ' + fmt(phi) + '°)' + (rf > 0 ? ', R' + fmt(rf) : '');
      c.comp = comp;
      return finish(c);
    });
    return { errors: [], kind: 'flats', contours: contours, aT: aT, R: R, r: r, rc: rf, rfMax: rfMax, chord: 2 * Math.sqrt(R * R - aT * aT) };
  }

  /* ---------- МНОГОГРАННИК ---------- */
  function buildPolygon(p) {
    var err = common(p), R = p.D / 2, r = p.toolD / 2, N = Math.round(p.N), rc = p.corner > 0 ? p.corner : 0;
    if (!(N >= 3)) err.push('Число граней должно быть ≥ 3');
    var aT = 0, beta = 0;
    if (!err.length) {
      beta = Math.PI / N;
      aT = p.sizeMode === 'corners' ? (p.size / 2) * Math.cos(beta) : p.size / 2;
      if (!(aT > 0)) err.push('Размер многогранника должен быть больше 0');
      if (aT >= R) err.push('Многогранник не снимает материал (размер под ключ ≥ диаметра заготовки)');
      if (rc > aT + 1e-9) err.push('Радиус скругления не может быть больше половины размера под ключ (' + fmt(aT) + ' мм)');
    }
    if (err.length) return { errors: err };
    var comp = p.comp || null;
    var step = comp === 'G41' ? -1 : comp === 'G42' ? 1 : (p.dir === 'CW' ? -1 : 1);
    var ccw = step === 1, tb = Math.tan(beta);
    function build(a, rcc) {
      var L = (a - rcc) * tb, segs = [], cur = null;
      function nrm(k) { return frame(p.phi + step * k * 360 / N); }
      function add(pt, arc) {
        if (!arc && cur && dist(cur, pt) < 1e-6) return;
        if (arc && cur && dist(cur, pt) < 1e-6) return;
        segs.push({ pt: pt, arc: arc || null }); cur = pt;
      }
      var m0 = nrm(0).at(a, 0); cur = m0;
      for (var k = 0; k < N; k++) {
        var f = nrm(k), fn = nrm((k + 1) % N);
        add(f.at(a, step * L));                               // конец грани
        if (rcc > 0) add(fn.at(a, -step * L), { R: rcc, ccw: ccw }); // дуга скругления
        else if (k < N - 1) { /* вершина совпадает с началом след. грани */ }
      }
      add(m0);
      return { start: m0, segs: segs };
    }
    var prog = comp ? build(aT, rc) : build(aT + r, rc > 0 ? rc + r : 0);
    var n0 = frame(p.phi);
    var c = { start: prog.start, segs: prog.segs, comp: comp, label: 'МНОГОГРАННИК N=' + N + ', ПОД КЛЮЧ ' + fmt(2 * aT) + (rc > 0 ? ', R' + fmt(rc) : '') };
    c.pre = n0.at(R + r + p.gap, 0);
    c.post = c.pre;
    finish(c);
    // для превью: центр фрезы
    if (comp) { var pc = build(aT + r, rc > 0 ? rc + r : 0); var tmp = finish({ start: pc.start, segs: pc.segs }); c.centre = tmp.line; } else c.centre = c.line;
    return { errors: [], kind: 'polygon', N: N, contours: [c], aT: aT, R: R, r: r, rc: rc, across_corners: 2 * aT / Math.cos(beta) };
  }

  /* ---------- G-КОД (только контур) ---------- */
  function gcode(model, p) {
    var L = [];
    function xy(pt) { return p.map ? p.map(pt) : ' X' + fmt(p.xMode === 'radius' ? pt.x : 2 * pt.x) + ' C' + fmt(pt.c); }
    model.contours.forEach(function (c, i) {
      L.push('(' + c.label + ')');
      L.push('G01' + xy(c.pre));                       // подход
      if (c.comp) {
        L.push(c.comp + ' G01' + xy(c.start) + (p.dOffset ? ' D' + p.dOffset : ''));
      } else L.push('G01' + xy(c.start));
      c.segs.forEach(function (s) {
        if (s.arc) L.push((s.arc.ccw ? 'G03' : 'G02') + xy(s.pt) + ' R' + fmt(s.arc.R));
        else L.push('G01' + xy(s.pt));
      });
      L.push((c.comp ? 'G40 ' : '') + 'G01' + xy(c.post)); // отход
      if (i < model.contours.length - 1) L.push('');
    });
    return L.join('\n');
  }

  function realPolar(pt) { return { r: Math.hypot(pt.x, pt.c), th: Math.atan2(pt.c, pt.x) / D2R }; }

  var api = { fmt: fmt, buildFlats: buildFlats, buildPolygon: buildPolygon, gcode: gcode, realPolar: realPolar, finish: finish, tess: tess, P: P };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Polar = api;
})(typeof self !== 'undefined' ? self : this);
</script>
<script>/* Фрезерные разделы: паз/карман/окружность, цилиндр G07.1, отверстия, торцевание, G68, гребешок, макросы. */
(function (root) {
  'use strict';
  var Polar = (typeof require !== 'undefined') ? require('./core.js') : root.Polar;
  var fmt = Polar.fmt, P = Polar.P, D2R = Math.PI / 180;
  function xOut(x, p) { return p.xMode === 'radius' ? x : 2 * x; }
  function xIn(X, p) { return p.xMode === 'radius' ? X : X / 2; }
  function tolist(a) { return a; }

  /* ---------- скруглённый прямоугольник: паз, карман, круг, бобышка ---------- */
  function rrBuild(hx, hy, rr, ccw, cx, cc, psi) {
    var cp = Math.cos(psi * D2R), sp = Math.sin(psi * D2R);
    function T(l) { return P(cx + l.x * cp - l.c * sp, cc + l.x * sp + l.c * cp); }
    var A = { x: 0, c: -hy }, V = [{ pt: A, arc: null }];
    function add(pt, arc) { var l = V[V.length - 1].pt; if (Math.hypot(pt.x - l.x, pt.c - l.c) < 1e-7) return; V.push({ pt: pt, arc: arc }); }
    var af = rr > 0 ? { R: rr, ccw: true } : null;
    add({ x: hx - rr, c: -hy }, null); if (rr > 0) add({ x: hx, c: -hy + rr }, af);
    add({ x: hx, c: hy - rr }, null); if (rr > 0) add({ x: hx - rr, c: hy }, af);
    add({ x: -hx + rr, c: hy }, null); if (rr > 0) add({ x: -hx, c: hy - rr }, af);
    add({ x: -hx, c: -hy + rr }, null); if (rr > 0) add({ x: -hx + rr, c: -hy }, af);
    add(A, null);
    if (!ccw) {
      var n = V.length - 1, rev = [{ pt: V[n].pt, arc: null }];
      for (var k = n; k >= 1; k--) rev.push({ pt: V[k - 1].pt, arc: V[k].arc ? { R: V[k].arc.R, ccw: false } : null });
      V = rev;
    }
    return { start: T(V[0].pt), segs: V.slice(1).map(function (v) { return { pt: T(v.pt), arc: v.arc }; }), T: T };
  }

  // o: hx, hy (полуразмеры: вдоль psi и поперёк), rr, psi, cx, cc, mode 'in'|'out', comp, dir, toolD, gap
  function rrContour(o) {
    var errors = [], warnings = [], r = o.toolD / 2, hx = o.hx, hy = o.hy, psi = o.psi || 0, rr0 = o.rr > 0 ? o.rr : 0;
    if (!(r > 0)) errors.push('Диаметр фрезы должен быть больше 0');
    if (!(hx > 0 && hy > 0)) errors.push('Размеры должны быть больше 0');
    if (!(o.gap > 0) && o.mode === 'out') errors.push('Зазор должен быть больше 0');
    if (errors.length) return { errors: errors, warnings: warnings };
    if (hx < hy) { var t = hx; hx = hy; hy = t; psi += 90; }
    if (rr0 > hy + 1e-9) return { errors: ['Радиус скругления не может быть больше половины меньшей стороны (' + fmt(hy) + ' мм)'], warnings: warnings };
    var rr = rr0, comp = o.comp || null;
    if (o.mode === 'in') {
      if (!(hy > r + 1e-9)) return { errors: ['Фреза не помещается: диаметр фрезы ' + fmt(2 * r) + ' мм не меньше размера ' + fmt(2 * hy) + ' мм. Режь по центру без контура'], warnings: warnings };
      if (rr < r - 1e-9) warnings.push('Радиус угла меньше радиуса фрезы: в углах останется R' + fmt(r));
    }
    var ccw = comp ? (o.mode === 'in' ? comp === 'G41' : comp === 'G42') : (o.dir === 'CCW');
    function shape(d) {
      if (o.mode === 'in') return rrBuild(hx - d, hy - d, Math.max(rr - d, 0), ccw, o.cx, o.cc, psi);
      return rrBuild(hx + d, hy + d, rr > 0 ? rr + d : 0, ccw, o.cx, o.cc, psi);
    }
    var prog = shape(0), cen = shape(r);
    var use = comp ? prog : cen;
    var cpt = P(o.cx, o.cc), pre;
    if (o.mode === 'in') pre = cpt;
    else pre = rrBuild(hx, hy, rr, true, o.cx, o.cc, psi).T({ x: 0, c: -(hy + r + o.gap) });
    var c = { pre: pre, start: use.start, segs: use.segs, post: pre, comp: comp, label: o.label || '' };
    Polar.finish(c);
    c.centre = Polar.finish({ start: cen.start, segs: cen.segs }).line;
    c.progLine = Polar.finish({ start: prog.start, segs: prog.segs }).line;
    return { errors: [], warnings: warnings, contours: [c], hx: hx, hy: hy, rr: rr, r: r, ccw: ccw };
  }

  function shapeDims(p) {
    if (p.shape === 'circle') return { hx: p.Dc / 2, hy: p.Dc / 2, rr: p.Dc / 2, name: 'КРУГ D' + fmt(p.Dc) };
    if (p.shape === 'slot') return { hx: p.L / 2, hy: p.W / 2, rr: p.W / 2, name: 'ПАЗ ' + fmt(p.L) + 'x' + fmt(p.W) };

/* ---------- состояние ---------- */
var S={x:'diameter',tab:'polar',v:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o)S=Object.assign(S,o);}}catch(e){}
S.v=S.v||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function mod(id){return MODS.filter(function(m){return m.id===id;})[0]||MODS[0];}
function vals(m){
  var v=S.v[m.id]=S.v[m.id]||{};
  m.fields.forEach(function(fd){if(v[fd.id]===undefined)v[fd.id]=fd.def;});
  return v;
}

/* ---------- форма ---------- */
function renderTabs(){
  $('tabs').innerHTML='';
  MODS.forEach(function(m){var b=document.createElement('button');b.textContent=m.title;b.setAttribute('aria-pressed',m.id===S.tab?'true':'false');
    b.onclick=function(){readForm();S.tab=m.id;save();renderAll();window.scrollTo(0,0);};$('tabs').appendChild(b);});
}
function renderForm(){
  var m=mod(S.tab),v=vals(m),h='<div class="card"><div class="grid">';
  m.fields.forEach(function(fd){
    var id='f_'+fd.id,label=typeof fd.l==='function'?fd.l(v):fd.l,cls=fd.full?' full':'';
    h+='<label class="fld'+cls+'" data-f="'+fd.id+'"><span class="lt">'+label+'</span>';
    if(fd.t==='s'){h+='<select id="'+id+'">'+fd.opts.map(function(o){return '<option value="'+o[0]+'"'+(String(v[fd.id])===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>';}
    else if(fd.t==='t'){h+='<textarea id="'+id+'" spellcheck="false">'+String(v[fd.id]).replace(/</g,'&lt;')+'</textarea>';}
    else h+='<input id="'+id+'" inputmode="decimal" value="'+v[fd.id]+'">';
    h+='</label>';
  });
  h+='</div></div>';
  $('form').innerHTML=h;
  m.fields.forEach(function(fd){var el=$('f_'+fd.id);el.addEventListener('change',function(){readForm();refreshShow();});el.addEventListener('input',function(){if(fd.t==='s')return;});});
  refreshShow();
  $('modeNote').textContent=m.note;
}
function readForm(){
  var m=mod(S.tab),v=vals(m);
  m.fields.forEach(function(fd){var el=$('f_'+fd.id);if(!el)return;v[fd.id]=fd.t==='s'?el.value:fd.t==='t'?el.value:num(el.value);});
  save();
}
function refreshShow(){
  var m=mod(S.tab),v=vals(m);
  m.fields.forEach(function(fd){
    var lab=document.querySelector('label[data-f="'+fd.id+'"]');if(!lab)return;
    lab.classList.toggle('hide',fd.show?!fd.show(v):false);
    if(typeof fd.l==='function')lab.querySelector('.lt').textContent=fd.l(v);
  });
}
function renderX(){document.querySelectorAll('#xsel button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.x===S.x?'true':'false');});}
function renderAll(){renderX();renderTabs();renderForm();$('out').classList.add('hide');$('errs').textContent='';$('warn').classList.add('hide');}

/* ---------- превью ---------- */
function pt(q){return {x:q.x,y:q.c!==undefined?q.c:q.y};}
function drawView(view){
  var items=view.items,minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  function ext(x,y,r){minx=Math.min(minx,x-r);maxx=Math.max(maxx,x+r);miny=Math.min(miny,y-r);maxy=Math.max(maxy,y+r);}
  items.forEach(function(it){
    if(it.t==='c')ext(it.cx,it.cy,it.r);
    else if(it.t==='p'&&it.fit!==false)it.pts.forEach(function(q){var a=pt(q);ext(a.x,a.y,0);});
    else if(it.t==='d')ext(it.x,it.y,it.r||0);
  });
  var w=maxx-minx,hh=maxy-miny,m=Math.max(w,hh,1)*0.08;
  var vx=minx-m,vy=-(maxy+m),vw=w+2*m,vh=hh+2*m,sw=Math.max(vw,vh)/170;
  var s='';
  items.forEach(function(it){
    var st=({stock:'stroke="var(--stock)" stroke-width="'+(sw*2)+'" stroke-dasharray="'+(sw*8)+' '+(sw*5)+'" fill="none"',
      part:'stroke="var(--ink)" stroke-width="'+(sw*2.6)+'" fill="'+(it.fill?'var(--acc2)':'none')+'" fill-opacity=".6" stroke-linejoin="round"',
      centre:'stroke="var(--fin)" stroke-width="'+(sw*1.5)+'" fill="none" stroke-linejoin="round"',
      move:'stroke="var(--rough)" stroke-width="'+(sw*1.5)+'" stroke-dasharray="'+(sw*3)+' '+(sw*2)+'" fill="none"',
      tool:'stroke="var(--fin)" stroke-width="'+sw+'" stroke-dasharray="'+(sw*3)+' '+(sw*3)+'" fill="none"',
      axis:'stroke="var(--line)" stroke-width="'+sw+'" fill="none"',
      dot:'fill="var(--acc)" stroke="none"'})[it.s];
    if(it.t==='c')s+='<circle cx="'+it.cx.toFixed(3)+'" cy="'+(-it.cy).toFixed(3)+'" r="'+it.r.toFixed(3)+'" '+st+'/>';
    else if(it.t==='p')s+='<polyline points="'+it.pts.map(function(q){var a=pt(q);return a.x.toFixed(3)+','+(-a.y).toFixed(3);}).join(' ')+'" '+st+'/>';
    else if(it.t==='d'){s+='<circle cx="'+it.x.toFixed(3)+'" cy="'+(-it.y).toFixed(3)+'" r="'+(it.r||sw*3).toFixed(3)+'" '+st+'/>';
      if(it.txt)s+='<text x="'+(it.x+(it.r||sw*3)*1.4).toFixed(3)+'" y="'+(-it.y-(it.r||sw*3)*1.4).toFixed(3)+'" font-size="'+(sw*8).toFixed(3)+'" fill="var(--mut)">'+it.txt+'</text>';}
  });
  var svg=$('svg');svg.setAttribute('viewBox',vx.toFixed(3)+' '+vy.toFixed(3)+' '+vw.toFixed(3)+' '+vh.toFixed(3));svg.innerHTML=s;
  $('viewTitle').textContent=view.title||'Схема';
  $('legend').innerHTML=(view.legend||[]).map(function(l){return '<span><i style="background:'+l[0]+'"></i>'+l[1]+'</span>';}).join('');
}
var LEG={part:['var(--ink)','деталь'],centre:['var(--fin)','центр фрезы'],move:['var(--rough)','подход / отход'],stock:['var(--stock)','заготовка']};
function axes(R){return [{t:'p',s:'axis',pts:[{x:-R,y:0},{x:R,y:0}],fit:false},{t:'p',s:'axis',pts:[{x:0,y:-R},{x:0,y:R}],fit:false}];}

var RUN={
polar:function(v,X){
  var p={D:v.D,toolD:v.toolD,size:v.size,phi:v.phi,gap:v.gap,dir:v.dir,comp:v.comp||null,dOffset:v.dOffset,corner:v.corner,xMode:X};
  if(v.shape==='poly'){p.N=v.N;p.sizeMode=v.sizeMode;}else if(v.shape==='flat2'){p.count=2;}else{p.count=1;p.flatMode=v.flatMode;}
  var build=function(q){return v.shape==='poly'?Polar.buildPolygon(q):Polar.buildFlats(q);};
  var m=build(p);if(m.errors.length)return {errors:m.errors};
  var np=build(Object.assign({},p,{comp:'G42'}));
  var items=[{t:'c',cx:0,cy:0,r:m.R,s:'stock'}];
  items=items.concat(axes(m.R*1.5));
  np.contours.forEach(function(c){items.push({t:'p',s:'part',pts:c.line,fill:v.shape==='poly'});});
  m.contours.forEach(function(c){
    items.push({t:'p',s:'centre',pts:c.centre});
    items.push({t:'p',s:'move',pts:[c.pre,c.centre[0]]});items.push({t:'p',s:'move',pts:[c.centre[c.centre.length-1],c.post]});
  });
  items.push({t:'c',cx:m.contours[0].centre[0].x,cy:m.contours[0].centre[0].c,r:m.r,s:'tool'});
  var sum,xf=function(x){return f(X==='radius'?x:2*x);};
  if(m.kind==='flats'){sum='Расстояние от оси до лыски: <b>'+f(m.aT)+'</b> мм · хорда: <b>'+f(m.chord)+'</b> мм<br>X лыски в программе: <b>'+xf(m.aT)+'</b>';if(m.rc>0)sum+='<br>Скругление краёв: <b>R'+f(m.rc)+'</b> (максимум: '+f(m.rfMax)+' мм)';}
  else{sum='Размер под ключ: <b>'+f(2*m.aT)+'</b> · по углам (острые): <b>'+f(m.across_corners)+'</b> мм';if(m.rc>0)sum+='<br>Скругление углов: <b>R'+f(m.rc)+'</b>';if(m.across_corners>p.D)sum+='<br>Углы выходят за заготовку: на углах останутся цилиндрические участки';}
  var t='<table style="margin-top:8px"><tr><th>Точка контура</th><th>X</th><th>C</th><th>R</th><th>Угол°</th></tr>';
  m.contours.forEach(function(c,ci){var tag=m.kind==='flats'?'л'+(ci+1)+' ':'';var all=[['начало',c.start]].concat(c.segs.map(function(sg,i){return [(sg.arc?'дуга ':'т.')+(i+1),sg.pt];}));
    all.forEach(function(a){var q=a[1],rp=Polar.realPolar(q);t+='<tr><td>'+tag+a[0]+'</td><td>'+xf(q.x)+'</td><td>'+f(q.c)+'</td><td>'+f(rp.r)+'</td><td>'+f(rp.th)+'</td></tr>';});});
  sum+='<details><summary>Проверка: X, C и реальные R, угол точек</summary>'+t+'</table></details>';
  return {code:Polar.gcode(m,p),sum:sum,view:{title:'Траектория (плоскость X–C)',items:items,legend:[LEG.stock,LEG.part,LEG.centre,LEG.move]}};
},
slot:function(v,X){
  var p=Object.assign({},v,{xMode:X,comp:v.comp||null});
  var m=Mill.buildSlot(p);if(m.errors.length)return {errors:m.errors};
  p.map=m.map;var c=m.contours[0];
  var items=axes(Math.max(m.hx,m.hy)*1.3+Math.abs(v.cc)+10);
  items.push({t:'p',s:'part',pts:c.progLine,fill:true});items.push({t:'p',s:'centre',pts:c.centre});
  items.push({t:'p',s:'move',pts:[c.pre,c.centre[0]]});items.push({t:'c',cx:c.centre[0].x,cy:c.centre[0].c,r:m.r,s:'tool'});
  var xf=function(x){return f(X==='radius'?x:2*x);};
  var sum='Фигура '+f(2*m.hx)+' × '+f(2*m.hy)+(m.rr>0?', углы R'+f(m.rr):'')+' · центр X'+xf(Mill.xIn(v.cx,{xMode:X}))+' '+m.axis+f(v.cc)+(v.shape!=='circle'?' · поворот '+f(v.psi)+'°':'');
  return {code:Polar.gcode(m,p),sum:sum,warnings:m.warnings,view:{title:'Схема (вид в плоскости '+(v.plane==='xy'?'X–Y':'X–C')+')',items:items,legend:[LEG.part,LEG.centre,LEG.move]}};
},
cyl:function(v,X){
  var p=Object.assign({},v,{comp:v.comp||null});
  var m=Mill.buildCyl(p);if(m.errors.length)return {errors:m.errors};
  p.map=m.map;var c=m.contours[0],rc=m.rc;
  var items=axes(Math.max(m.hx,m.hy)*1.3+10);
  items.push({t:'p',s:'part',pts:c.progLine,fill:true});items.push({t:'p',s:'centre',pts:c.centre});
  items.push({t:'p',s:'move',pts:[c.pre,c.centre[0]]});items.push({t:'c',cx:c.centre[0].x,cy:c.centre[0].c,r:m.r,s:'tool'});
  var sum='Развёртка: по горизонтали Z, по вертикали длина дуги; 1° = '+f(rc*D2R)+' мм. Фигура '+f(2*m.hx)+' × '+f(2*m.hy)+(m.rr>0?', углы R'+f(m.rr):'')+(v.shape!=='circle'?' · угол к оси Z: <b>'+f(m.psi)+'°</b>':'');
  var code='(G18 · G07.1 C'+f(rc)+' — ВКЛЮЧИТЬ, РАДИУС ЦИЛИНДРА)\n'+Polar.gcode(m,p)+'\n(G07.1 C0 — ОТМЕНА)';
  return {code:code,sum:sum,warnings:m.warnings,view:{title:'Развёртка цилиндра (Z, длина дуги)',items:items,legend:[LEG.part,LEG.centre,LEG.move]}};
},
holes:function(v,X){
  var p=Object.assign({},v,{xMode:X});var r=Mill.holes(p);if(r.errors.length)return {errors:r.errors};
  var maxr=0;r.pts.forEach(function(q){maxr=Math.max(maxr,Math.hypot(q.x,q.y));});
  var items=axes(maxr*1.3+5);
  if(v.pattern==='circle'||v.pattern==='arc')items.push({t:'c',cx:Mill.xIn(v.cx,{xMode:X}),cy:v.cy,r:v.pcd/2,s:'stock'});
  var rd=Math.max(maxr,10)/45;
  r.pts.forEach(function(q,i){items.push({t:'d',x:q.x,y:q.y,r:rd,s:'dot',txt:String(i+1)});});
  return {code:r.text,sum:'Отверстий: <b>'+r.pts.length+'</b>',view:{title:'Позиции (вид в плоскости X–Y, X в мм от оси)',items:items,legend:[]}};
},
face:function(v,X){
  var p=Object.assign({},v,{xMode:X});var m=Mill.face(p);if(m.errors.length)return {errors:m.errors};
  var items=[];var R=Math.max(m.halfAlong,m.halfAcross);items=items.concat(axes(R*1.6));
  var hx=m.alongX?m.halfAlong:m.halfAcross,hy=m.alongX?m.halfAcross:m.halfAlong;
  if(v.area==='disk')items.push({t:'c',cx:m.cx,cy:m.cy,r:v.Dd/2,s:'part'});
  else items.push({t:'p',s:'part',pts:[{x:m.cx-hx,y:m.cy-hy},{x:m.cx+hx,y:m.cy-hy},{x:m.cx+hx,y:m.cy+hy},{x:m.cx-hx,y:m.cy+hy},{x:m.cx-hx,y:m.cy-hy}]});
  m.passes.forEach(function(ps,i){items.push({t:'p',s:'centre',pts:ps});if(i>0)items.push({t:'p',s:'move',pts:[m.passes[i-1][1],ps[0]]});});
  items.push({t:'c',cx:m.passes[0][0].x,cy:m.passes[0][0].y,r:m.r,s:'tool'});
  var sum='Проходов: <b>'+m.n+'</b> · шаг: <b>'+f(m.step)+'</b> мм · перекрытие проходов: <b>'+f(m.overlap)+'</b> %';
  return {code:m.text,sum:sum,warnings:m.warnings,view:{title:'Проходы (вид в плоскости X–Y)',items:items,legend:[LEG.part,LEG.centre,LEG.move]}};
},
g68:function(v,X){
  var p=Object.assign({},v,{xMode:X});var r=Mill.rot68(p);if(r.errors.length)return {errors:r.errors};
  return {code:r.text,sum:'Положительный угол — против часовой стрелки в плоскости X–Y. Центр и точки — в тех же единицах X, что в программе.'};
},
scal:function(v,X){
  var r=Mill.scallop(v);if(r.errors.length)return {errors:r.errors};
  var s='Шаг: <b>'+f(r.a)+'</b> мм (<b>'+f(r.aPct)+'</b> % диаметра инструмента)<br>Высота гребешка Rz: <b>'+r.h.toFixed(4)+'</b> мм = <b>'+(r.h*1000).toFixed(1)+'</b> мкм<br>Ra ≈ <b>'+(r.Ra*1000).toFixed(2)+'</b> мкм';
  if(v.surf!=='flat')s+='<br>Эффективный радиус с учётом кривизны поверхности: <b>'+f(r.Re)+'</b> мм';
  return {sum:s};
},
macro:function(v,X){
  var p=Object.assign({},v,{xMode:X,rounded:v.rounded==='1'});
  if(v.type==='bolt')return {code:Mill.macroBolt(p),sum:'Вызов: G65 P'+v.onum+' A… B… C… '+(v.plane==='xy'?'I… J…':'')+'. Аргументы: A — число, B — диаметр окружности, C — стартовый угол'+(v.plane==='xy'?', I — X центра (как в программе), J — Y центра':'')+'.'};
  return {code:Mill.macroPoly(p),sum:'Вызов: G65 P'+v.onum+' A… B… C… I… J… K…: A — число граней, B — размер под ключ, C — радиус угла, I — угол грани 1, J — радиус подхода от оси до оси фрезы (R заготовки + R фрезы + зазор), K — номер D. Перед вызовом включи G12.1.'};
}
};

var lastCode='';
function calc(){
  readForm();
  var m=mod(S.tab),v=vals(m),res;
  try{res=RUN[m.id](v,S.x);}catch(e){res={errors:['Ошибка расчёта: '+e.message]};}
  $('warn').classList.add('hide');
  if(res.errors&&res.errors.length){$('errs').textContent=res.errors.join('. ');$('out').classList.add('hide');return;}
  $('errs').textContent='';
  if(res.warnings&&res.warnings.length){$('warn').textContent=res.warnings.join('. ');$('warn').classList.remove('hide');}
  $('out').classList.remove('hide');
  $('sum').innerHTML=res.sum||'';
  lastCode=res.code||'';
  $('codeCard').classList.toggle('hide',!lastCode);
  $('code').textContent=lastCode;
  $('viewCard').classList.toggle('hide',!res.view);
  if(res.view)drawView(res.view);
  $('out').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- события ---------- */
document.querySelectorAll('#xsel button').forEach(function(b){b.addEventListener('click',function(){S.x=b.dataset.x;save();renderX();$('out').classList.add('hide');});});
$('calc').addEventListener('click',calc);
$('reset').addEventListener('click',function(){var m=mod(S.tab);delete S.v[m.id];save();renderForm();$('out').classList.add('hide');$('errs').textContent='';$('warn').classList.add('hide');});
$('copy').addEventListener('click',function(){
  function done(){$('copy').textContent='Скопировано';setTimeout(function(){$('copy').textContent='Копировать';},1500);}
  function fallback(){var ta=document.createElement('textarea');ta.value=lastCode;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(ta);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(lastCode).then(done,fallback);}else fallback();
});
$('share').addEventListener('click',function(){if(navigator.share){navigator.share({title:'G-код',text:lastCode}).catch(function(){});}else $('copy').click();});
renderAll();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
